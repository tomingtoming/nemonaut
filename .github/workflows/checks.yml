name: Build and type check
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/checks.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build dist (copy src, generate the bundles)
        run: npm run build
      - name: Type check (strict tsc, no any/ts-ignore, no assertions outside boundaries, no new import cycles, Prettier format)
        run: npm run typecheck
