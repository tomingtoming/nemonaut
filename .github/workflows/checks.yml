name: Type check and bundles
on:
  workflow_dispatch:
  push:
    paths:
      - 'dist/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/checks.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install
        run: npm ci --ignore-scripts
      - name: Type check (tsc over dist, JSDoc and inference)
        run: npm run typecheck
      - name: Generated bundles match their sources
        # A source change that a bundle imports must be followed by its rebuild (missed once after 1b, found in 2d).
        run: npm run check:bundles
